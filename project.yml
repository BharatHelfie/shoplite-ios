name: ShopLite
options:
  bundleIdPrefix: com.shoplite
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    OTHER_SWIFT_FLAGS: "-enable-upcoming-feature IsolatedDefaultValues"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShopLite:
    type: application
    platform: iOS
    sources: [ShopLite]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shoplite.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ShopLite
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ShopLiteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ShopLiteTests]
    dependencies:
      - target: ShopLite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ShopLite:
    build:
      targets:
        ShopLite: all
    test:
      targets: [ShopLiteTests]
